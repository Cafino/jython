# Run ant test on Jython 2.7 (GitHub action)

name: ant test 2.7

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  # build once
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Full Build with Ant
        run: ant

      # preserve the built files for later
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-output-${{ matrix.os }}
          path: dist/

  # run the ci tests
  test:
    needs: build # wait for build to finish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: [11, 17, 21, 25]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      # fetch the previously built files
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: build-output-${{ matrix.os }}
          path: dist/

      - name: Test with Ant
        run: ant test-ci
